name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH without prerelease or build metadata."
            exit 1
          fi
      - name: Verify and test
        shell: bash
        run: |
          go mod verify
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { printf 'Files require gofmt:\n%s\n' "$unformatted"; exit 1; }
          go vet ./...
          go test ./...
          go test -race ./...

  package:
    name: Build and test Windows artifacts
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Require an elevated test token
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The release job requires administrator privileges for isolated HKLM, SCM, and MSI tests.'
          }
      - name: Verify dependencies
        run: go mod verify
      - name: Run Windows tests
        id: windows-unit
        run: go test ./...
      - name: Run isolated Windows integration tests
        if: success() || steps.windows-unit.outcome == 'failure'
        run: go test -tags=integration ./...
      - name: Build signed-version metadata and unsigned packages
        id: package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $msiVersion = $tag.Substring(1)
          "msi_version=$msiVersion" >> $env:GITHUB_OUTPUT
          ./scripts/package.ps1 -Version $tag
          ./tests/integration/checksums.ps1 -DistDirectory ./dist
      - name: Verify executable metadata
        shell: pwsh
        run: |
          $output = (& ./dist/wininit-windows-amd64.exe version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "wininit version failed: $output" }
          if ($output -notlike "*$env:GITHUB_REF_NAME*") {
            throw "Version output '$output' does not contain '$env:GITHUB_REF_NAME'."
          }
      - name: Exercise silent MSI install and uninstall
        shell: pwsh
        run: |
          ./tests/integration/msi-smoke.ps1 `
            -MsiPath ./dist/wininit-windows-amd64.msi `
            -ExpectedMsiVersion '${{ steps.package.outputs.msi_version }}' `
            -ExpectedExecutableVersion "$env:GITHUB_REF_NAME" `
            -ArtifactsDirectory ./artifacts
      - name: Stage diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/agent-logs | Out-Null
          if (Test-Path -LiteralPath C:/ProgramData/WinInit/logs) {
            Copy-Item C:/ProgramData/WinInit/logs/*.log ./artifacts/agent-logs/ -ErrorAction Stop
            Get-Content C:/ProgramData/WinInit/logs/wininit.log -Tail 100
          }
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-failure-diagnostics-${{ github.run_id }}
          path: artifacts/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ github.ref_name }}
          path: |
            dist/wininit-windows-amd64.exe
            dist/wininit-windows-amd64.msi
            dist/wininit-plugin-configdrive-windows-amd64.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6dbab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Publish release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/wininit-windows-amd64.exe \
            dist/wininit-windows-amd64.msi \
            dist/wininit-plugin-configdrive-windows-amd64.exe \
            dist/SHA256SUMS \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-validation:
    name: Go validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: go mod verify
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Files require gofmt:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race-enabled tests
        run: go test -race ./...
      - name: Build Windows AMD64 executable
        run: make build
      - name: Upload executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wininit-windows-amd64-exe
          path: dist/wininit-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14

  windows-validation:
    name: Windows and MSI validation
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record runner environment
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, OsBuildNumber, OsArchitecture | Format-List
          whoami.exe /all
      - name: Require an elevated test token
        shell: pwsh
        run: |
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'The Windows integration job requires administrator privileges for isolated HKLM, SCM, and MSI tests.'
          }
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Verify dependencies
        run: go mod verify
      - name: Run Windows tests
        run: go test ./...
      - name: Run isolated Windows integration tests
        run: go test -tags=integration ./...
      - name: Build executable and MSI
        id: package
        shell: pwsh
        run: |
          $build = [int64]$env:GITHUB_RUN_NUMBER % 65535
          $version = "0.0.$build"
          "version=$version" >> $env:GITHUB_OUTPUT
          ./scripts/package.ps1 -Version $version
      - name: Exercise silent MSI install and uninstall
        shell: pwsh
        run: |
          ./tests/integration/msi-smoke.ps1 `
            -MsiPath ./dist/wininit-windows-amd64.msi `
            -ExpectedMsiVersion '${{ steps.package.outputs.version }}' `
            -ExpectedExecutableVersion '${{ steps.package.outputs.version }}' `
            -ArtifactsDirectory ./artifacts
      - name: Upload MSI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-failure-diagnostics-${{ github.run_id }}
          path: |
            artifacts/**
            C:/ProgramData/WinInit/logs/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wininit-windows-amd64
          path: |
            dist/wininit-windows-amd64.exe
            dist/wininit-windows-amd64.msi
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

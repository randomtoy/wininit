version: 1
log:
  level: info
  directory: 'C:\ProgramData\WinInit\logs'
state:
  registry_path: 'SOFTWARE\Wininit'
plugins:
  directory: 'C:\ProgramData\WinInit\plugins'
  datasources:
    nocloud:
      enabled: false
      seed_directory: ''
      discover_volumes: true
    configdrive:
      enabled: false
      seed_directory: ''
      discover_volumes: true
      execution: builtin
      process:
        executable: ''
        sha256: ''
        timeout_seconds: 15
  provisioners:
    hostname:
      enabled: false
    password_policy:
      enabled: false
      minimum_length: 14
      maximum_age_days: 90
      minimum_age_days: 1
      history_length: 24
      lockout_threshold: 10
      lockout_duration_minutes: 15
      lockout_window_minutes: 15
    local_users:
      enabled: false
      users: []
    authorized_keys:
      enabled: false
      users: []
    powershell_user_data:
      enabled: false
      allow_privileged: false
      execution_id: ''
      script_sha256: ''
      max_output_bytes: 65536
      process:
        executable: ''
        sha256: ''
        timeout_seconds: 120
reboot:
  policy: never

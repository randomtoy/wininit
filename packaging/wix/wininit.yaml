version: 1
log:
  level: info
  directory: 'C:\ProgramData\WinInit\logs'
state:
  registry_path: 'SOFTWARE\Wininit'
plugins:
  directory: 'C:\ProgramData\WinInit\plugins'
  datasources:
    nocloud:
      enabled: false
      seed_directory: ''
      discover_volumes: true
  provisioners:
    hostname:
      enabled: false
reboot:
  policy: never
